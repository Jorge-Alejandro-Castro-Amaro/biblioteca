<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Información de la Biblioteca Universitaria Central.">
    <title>{{ titulo }} | Biblioteca Universitaria Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f8fa;
            color: #263746;
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        .pagina-encabezado {
            background: #183b56;
            color: #fff;
        }

        .pagina-encabezado p {
            color: #e3edf3;
            max-width: 48rem;
        }

        .tarjeta-biblioteca {
            border: 1px solid #e0e8ed;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Biblioteca Universitaria Central</a>
                <ul class="navbar-nav flex-row flex-wrap ms-lg-auto">
                    <li class="nav-item"><a class="nav-link px-3 {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link px-3 {% if request.endpoint == 'catalogo' %}active{% endif %}" href="{{ url_for('catalogo') }}">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link px-3 {% if request.endpoint == 'servicios' %}active{% endif %}" href="{{ url_for('servicios') }}">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link px-3 {% if request.endpoint == 'contacto' %}active{% endif %}" href="{{ url_for('contacto') }}">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="container-fluid py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="container-fluid border-top text-center text-secondary py-4">
        Biblioteca Universitaria Central · Un espacio para aprender, investigar y compartir.
    </footer>
</body>
</html>
